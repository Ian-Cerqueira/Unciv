Limitations =
 # Requires translation!
This is a work in progress. =
 # Requires translation!
For technical reasons, only direct keys or Ctrl-Letter combinations can be used. =
Using the Keys page =
 # Requires translation!
Each binding has a button with an image looking like this: =
